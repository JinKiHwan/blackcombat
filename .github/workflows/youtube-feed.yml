name: Refresh YouTube feed
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-feed.yml'
      - 'scripts/youtube-feed.mjs'
      - 'scripts/sync-youtube.mjs'
permissions:
  contents: write
concurrency:
  group: youtube-feed-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect official public videos
        env:
          YOUTUBE_SYNC_STRICT: '1'
        run: |
          node scripts/sync-youtube.mjs
          cp public/data/youtube.json "$RUNNER_TEMP/youtube.json"
      - name: Publish feed independently of site deployments
        run: |
          branch=codex/youtube-feed
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch" --depth=1
            git checkout -B "$branch" FETCH_HEAD
          else
            git checkout -b "$branch"
          fi
          mkdir -p public/data
          cp "$RUNNER_TEMP/youtube.json" public/data/youtube.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/youtube.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update official YouTube feed [skip ci]'
          git push origin "$branch"
